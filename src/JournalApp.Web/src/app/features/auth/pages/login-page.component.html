<section class="auth">
  <div class="auth__card card">
    <header class="auth__header">
      <span class="auth__logo" aria-hidden="true">📔</span>
      <h1 class="auth__title">Welcome back</h1>
      <p class="auth__subtitle">Sign in to keep writing your journal.</p>
    </header>

    @if (errorMessage(); as message) {
      <app-alert [message]="message" />
    }

    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="field__label" for="login-email">Email</label>
        <input
          id="login-email"
          class="field__input"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="!!errorFor('email', 'Email')"
          aria-describedby="login-email-error"
        />
        @if (errorFor('email', 'Email'); as error) {
          <p id="login-email-error" class="field__error">{{ error }}</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="login-password">Password</label>
        <input
          id="login-password"
          class="field__input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="!!errorFor('password', 'Password')"
          aria-describedby="login-password-error"
        />
        @if (errorFor('password', 'Password'); as error) {
          <p id="login-password-error" class="field__error">{{ error }}</p>
        }
      </div>

      <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
    <p class="auth__switch">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</section>
